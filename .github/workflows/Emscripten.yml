name: CMake / Emscripten

on:
  push:
    branches:
      - '**' # only run on branches
  pull_request:
  release:
    types: [published]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  EM_VERSION: 2.0.18
  EM_CACHE_FOLDER: 'emsdk-cache'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Checkout Examples
      uses: actions/checkout@v7
      with:
        repository: 32blit/32blit-examples
        path: 32blit-examples

    - name: Install Python Dependencies
      shell: bash
      run: |
        python3 -m venv .venv
        source .venv/bin/activate
        python -m pip install -r tools/requirements.txt -r docs/requirements.txt
        echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH
        echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV

    - name: Setup cache
      id: cache-system-libraries
      uses: actions/cache@v6
      with:
        path: ${{env.EM_CACHE_FOLDER}}
        key: ${{env.EM_VERSION}}-${{runner.os}}

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v16
      with:
        version: ${{env.EM_VERSION}}
        actions-cache-folder: ${{env.EM_CACHE_FOLDER}}

    - name: Create Build Environment
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Set Tag Variable
      if: github.event_name == 'release'
      shell: bash
      run: echo "TRAVIS_TAG=${{github.event.release.tag_name}}" >> $GITHUB_ENV

    - name: Configure CMake
      shell: bash
      working-directory: ${{runner.workspace}}/build
      run: emcmake cmake $GITHUB_WORKSPACE/32blit-examples -D32BLIT_DIR=$GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG"

    # Problem matching
    - uses: ammaraskar/gcc-problem-matcher@master

    - name: Build
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: |
        embuilder.py build sdl2 sdl2-image-jpg sdl2-net
        cmake --build . --config $BUILD_TYPE -j 2

    - name: Prepare Site
      run: |
        mkdir -p site/web-examples
        cp ../build/*/*.{js,wasm} site/web-examples

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{github.event.repository.name}}-${{github.sha}}-web
        path: site

    # build the docs site (MkDocs, from docs/) next to the web examples
    - name: Build Docs
      if: github.ref == 'refs/heads/master' # github.event_name == 'release'
      run: |
        mkdocs build --strict
        cp -r build-docs/* site

    # The site (docs + web examples) is hosted on Cloudflare Pages at
    # https://sdk.chilichip.eu. Needs the CLOUDFLARE_API_TOKEN (Pages: Edit)
    # and CLOUDFLARE_ACCOUNT_ID secrets (set for the organisation).
    - name: Create Cloudflare Pages project
      if: github.ref == 'refs/heads/master'
      continue-on-error: true # already exists after the first run
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{secrets.CLOUDFLARE_API_TOKEN}}
        accountId: ${{secrets.CLOUDFLARE_ACCOUNT_ID}}
        command: pages project create chilichip-sdk --production-branch=master

    - name: Deploy to Cloudflare Pages
      if: github.ref == 'refs/heads/master'
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{secrets.CLOUDFLARE_API_TOKEN}}
        accountId: ${{secrets.CLOUDFLARE_ACCOUNT_ID}}
        command: pages deploy site --project-name=chilichip-sdk --branch=master

    - name: Attach sdk.chilichip.eu to the Pages project
      if: github.ref == 'refs/heads/master'
      continue-on-error: true # already attached after the first run
      env:
        CLOUDFLARE_API_TOKEN: ${{secrets.CLOUDFLARE_API_TOKEN}}
        CLOUDFLARE_ACCOUNT_ID: ${{secrets.CLOUDFLARE_ACCOUNT_ID}}
      run: |
        curl -sS --fail-with-body -X POST \
          "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/chilichip-sdk/domains" \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
          -H "Content-Type: application/json" \
          --data '{"name":"sdk.chilichip.eu"}'
