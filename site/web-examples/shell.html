<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Emscripten-Generated Code</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      canvas {
        width: 100vw;
        height: 100vh;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
      }

      #audio-toggle {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        z-index: 1;
        min-width: 48px;
        min-height: 48px;
        padding: 10px 14px;
        border: 2px solid #777;
        border-radius: 10px;
        background: #202020eF;
        color: #f0f4f8;
        font: 600 14px system-ui, sans-serif;
        cursor: pointer;
        touch-action: manipulation;
      }
      #audio-toggle[aria-pressed="true"] {
        border-color: #5fb8ff;
        background: #17466a;
      }
      #audio-toggle:focus-visible {
        outline: 3px solid #5fb8ff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    <button id="audio-toggle" type="button" aria-label="Mute game audio" aria-pressed="false" hidden>Mute game audio</button>
    <script type='text/javascript'>
      var Module = {
        print: function(text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
          console.log(text);
        },
        printErr: function(text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
          console.error(text);
        },
        canvas: document.getElementById('canvas')
      };

      Module.onRuntimeInitialized = function() {
        var audioToggle = document.getElementById('audio-toggle');
        var canvas = document.getElementById('canvas');
        if (typeof Module._blit_set_audio_muted !== 'function') return;

        audioToggle.hidden = false;
        audioToggle.addEventListener('click', function(event) {
          var muted = audioToggle.getAttribute('aria-pressed') !== 'true';
          try {
            if (Module._blit_set_audio_muted(muted ? 1 : 0) !== 1) {
              audioToggle.disabled = true;
              return;
            }

            audioToggle.setAttribute('aria-pressed', muted ? 'true' : 'false');
          } finally {
            var pointerActivation = typeof event.pointerId === 'number'
              ? event.pointerId !== -1
              : event.detail > 0;
            if (pointerActivation) canvas.focus();
          }
        });
      };

      // add main js
      const appName = new URLSearchParams(document.location.search.substring(1)).get("app");
      const scriptEl = document.createElement("script");
      scriptEl.src = appName + ".js";

      document.body.appendChild(scriptEl);
    </script>
  </body>
</html>
